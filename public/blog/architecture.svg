  <rect x="300" y="370" width="600" height="70" fill="none" stroke="#06d6d0" stroke-width="2" rx="5"/>
  <text x="600" y="410" font-size="20" font-weight="600" text-anchor="middle" fill="#06d6d0" font-family="system-ui">Data Layer</text>
