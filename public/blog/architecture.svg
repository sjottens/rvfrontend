  <text x="600" y="140" font-size="20" font-weight="600" text-anchor="middle" fill="#00d4ff" font-family="system-ui">Presentation Layer</text>
  <!-- Layer 3: Application -->
  <rect x="300" y="190" width="600" height="70" fill="none" stroke="#06b6d4" stroke-width="2" rx="5"/>
  <text x="600" y="230" font-size="20" font-weight="600" text-anchor="middle" fill="#06b6d4" font-family="system-ui">Application Layer</text>
  <!-- Connections -->
  <line x1="600" y1="170" x2="600" y2="190" stroke="#00d4ff" stroke-width="2"/>
  <!-- Layer 2: Business Logic -->
  <rect x="300" y="280" width="600" height="70" fill="none" stroke="#0891b2" stroke-width="2" rx="5"/>
  <text x="600" y="320" font-size="20" font-weight="600" text-anchor="middle" fill="#0891b2" font-family="system-ui">Business Logic Layer</text>
