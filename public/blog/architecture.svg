  <!-- Title -->
  <text x="600" y="530" font-size="48" font-weight="600" text-anchor="middle" fill="#ffffff" font-family="system-ui">Frontend Architecture</text>
  <text x="600" y="600" font-size="32" text-anchor="middle" fill="#00d4ff" font-family="system-ui">Patterns & Best Practices</text>
