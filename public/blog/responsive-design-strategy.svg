<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050812;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg5)"/>
  <!-- Responsive devices -->
  <!-- Mobile -->
  <rect x="280" y="150" width="120" height="200" fill="#0f172a" stroke="#00d4ff" stroke-width="3" rx="12"/>
  <rect x="290" y="165" width="100" height="170" fill="#1a1a2e" rx="8"/>
  <!-- Tablet -->
  <rect x="500" y="160" width="180" height="140" fill="#0f172a" stroke="#06b6d4" stroke-width="3" rx="10"/>
  <rect x="512" y="172" width="156" height="116" fill="#1a1a2e" rx="6"/>
  <!-- Desktop -->
  <rect x="800" y="140" width="220" height="160" fill="#0f172a" stroke="#0891b2" stroke-width="3" rx="10"/>
  <rect x="810" y="150" width="200" height="130" fill="#1a1a2e" rx="6"/>
  <rect x="800" y="300" width="220" height="15" fill="#0f172a" rx="4"/>
  <!-- Arrows connecting devices -->
  <path d="M 410 250 L 480 250" stroke="#00d4ff" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 690 250 L 760 250" stroke="#00d4ff" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#00d4ff"/>
    </marker>
  </defs>
  <!-- Title -->
  <text x="600" y="500" font-size="48" font-weight="600" text-anchor="middle" fill="#ffffff" font-family="system-ui">Responsive Design</text>
  <text x="600" y="570" font-size="32" text-anchor="middle" fill="#00d4ff" font-family="system-ui">Mobile-First Strategy</text>
</svg>